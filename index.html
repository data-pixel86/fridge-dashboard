<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fridge Newspaper</title>

    <style>
        body {
            background: white;
            color: black;
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 5px;
        }

        #date {
            font-size: 24px;
            margin-bottom: 30px;
        }

        .box {
            border-top: 3px solid black;
            padding-top: 15px;
            margin-top: 20px;
        }

        .weather {
            font-size: 32px;
            font-weight: bold;
        }

        .headline {
            font-size: 28px;
            margin: 18px 0;
        }
    </style>
</head>

<body>

    <h1>THE FRIDGE</h1>

    <div id="date"></div>

    <div class="box">
        <div class="weather">🌤 WEATHER</div>
        <p>Manchester</p>
        <p id="weatherText">Loading weather...</p>
    </div>

    <div class="box">
        <div class="weather">📰 NEWS</div>

        <div class="headline">
            Welcome to your fridge newspaper.
        </div>

        <div class="headline">
            Your daily briefing will appear here.
        </div>
    </div>

    <script>
        var now = new Date();

        document.getElementById("date").innerHTML =
            now.toLocaleDateString("en-GB", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });
            fetch("https://api.open-meteo.com/v1/forecast?latitude=53.4808&longitude=-2.2426&current=temperature_2m,weather_code&timezone=Europe%2FLondon")
        .then(function(response) {
            return response.json();
        })
        .then(function(data) {
            document.getElementById("weatherText").innerHTML =
                Math.round(data.current.temperature_2m) + "°C";
        });
    </script>

</body>
</html>
