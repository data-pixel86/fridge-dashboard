<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fridge Newspaper</title>

    <style>

.news-story {
    margin: 22px 0;
}

.news-headline {
    font-family: Arial, sans-serif;
    font-size: 26px;
    font-weight: bold;
    line-height: 1.15;
}

.news-summary {
    font-family: Arial, sans-serif;
    font-size: 19px;
    line-height: 1.2;
    margin-top: 7px;
    margin-left: 28px;
}
        
        body {
            background: white;
            color: black;
            font-family: monospace;
            margin: 30px;
        }


        /* HEADER */

        .date-row {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .date {
            display: inline-block;
        }

        .sun-times {
            float: right;
            text-align: right;
        }

        .clear {
            clear: both;
        }


        /* DIVIDER */

        .divider {
            border-top: 3px solid black;
            margin-top: 10px;
            padding-top: 15px;
        }


        /* WEATHER */

        .weather-title {
            font-family: Arial, sans-serif;
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .weather-layout {
            width: 100%;
        }

        .weather-left {
            width: 48%;
            display: inline-block;
            vertical-align: top;
        }

        .weather-right {
            width: 48%;
            display: inline-block;
            vertical-align: top;
        }

        .subheading {
            font-family: Arial, sans-serif;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }


        /* HOURLY FORECAST */

        .forecast-row {
            font-size: 22px;
            margin: 8px 0;
            height: 40px;
            white-space: nowrap;
        }

        .forecast-time {
            display: inline-block;
            width: 65px;
            font-weight: bold;
            vertical-align: middle;
        }

        .forecast-icon {
            width: 40px;
            height: 40px;
            vertical-align: middle;
            margin-right: 8px;
        }

        .forecast-temp {
            display: inline-block;
            width: 60px;
            vertical-align: middle;
        }


        /* DAILY FORECAST */

        .daily-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 22px;
        }

        .daily-table tr {
            height: 40px;
        }

        .daily-day {
            width: 55px;
            font-family: monospace;
            font-weight: bold;
            vertical-align: middle;
        }

        .daily-icon {
            width: 45px;
            vertical-align: middle;
        }

        .daily-icon img {
            width: 40px;
            height: 40px;
            vertical-align: middle;
        }

        .daily-temp {
            width: 115px;
            vertical-align: middle;
            white-space: nowrap;
            padding-right: 10px;
        }

        .daily-rain {
            vertical-align: middle;
            white-space: nowrap;
            padding-left: 5px;
        }


        /* NEWS */

        .news-box {
            border-top: 3px solid black;
            padding-top: 15px;
            margin-top: 20px;
        }

        .news-title {
            font-family: Arial, sans-serif;
            font-size: 34px;
            font-weight: bold;
        }

        .headline {
            font-size: 30px;
            margin: 18px 0;
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="date-row">

        <div class="date">
            <span id="date"></span>
        </div>

        <div class="sun-times">

            SUNRISE
            <span id="sunriseText">--:--</span>

            &nbsp;&nbsp;

            SUNSET
            <span id="sunsetText">--:--</span>

        </div>

        <div class="clear"></div>

    </div>


    <div class="divider"></div>


    <!-- WEATHER -->

    <div class="weather-title">
        WEATHER
    </div>


    <div class="weather-layout">


        <!-- LEFT COLUMN -->

        <div class="weather-left">

            <div class="subheading">
                NEXT 5 HRS.
            </div>

            <div id="weatherText">
                Loading weather...
            </div>

        </div>


        <!-- RIGHT COLUMN -->

        <div class="weather-right">

            <div class="subheading">
                NEXT FEW DAYS
            </div>

            <table class="daily-table">

                <tbody id="dailyText">

                    <tr>

                        <td colspan="4">
                            Loading forecast...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </div>


    <!-- NEWS -->

    <div class="news-box">

    <div class="news-title">
        NEWS
    </div>

    <div id="newsText">
        Loading news...
    </div>

</div>


    <script>


        /* DATE */

        var now = new Date();

        document.getElementById("date").innerHTML =
            now.toDateString();


        /* WEATHER ICON */

        function getWeatherIcon(code) {

            if (code === 0 || code === 1) {
                return "images/SUNNY.png";
            }

            if (code === 2) {
                return "images/PARTLY_CLOUDY.png";
            }

            if (code === 3) {
                return "images/CLOUDY.png";
            }

            if (code === 45 || code === 48) {
                return "images/FOG.png";
            }

            if (
                code === 51 || code === 53 || code === 55 ||
                code === 56 || code === 57 ||
                code === 61 || code === 63 || code === 65 ||
                code === 66 || code === 67
            ) {
                return "images/RAIN.png";
            }

            if (
                code === 80 || code === 81 || code === 82
            ) {
                return "images/SHOWERS.png";
            }

            if (
                code === 71 || code === 73 || code === 75 ||
                code === 77 || code === 85 || code === 86
            ) {
                return "images/SNOW.png";
            }

            if (
                code === 95 || code === 96 ||
                code === 97 || code === 99
            ) {
                return "images/STORM.png";
            }

            return "images/CLOUDY.png";

        }


        /* WEATHER API */

        var xhr = new XMLHttpRequest();

        xhr.open(
            "GET",
            "https://api.open-meteo.com/v1/forecast?latitude=53.4808&longitude=-2.2426&hourly=temperature_2m,weather_code,precipitation_probability&current=temperature_2m&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max&timezone=Europe%2FLondon&forecast_days=5",
            true
        );


        xhr.onreadystatechange = function() {


            if (
                xhr.readyState === 4 &&
                xhr.status === 200
            ) {


                var data =
                    JSON.parse(xhr.responseText);


                /* FIND CURRENT HOUR */

                var currentHour =
                    data.current.time.substring(0, 13);

                var startIndex = 0;


                for (
                    var j = 0;
                    j < data.hourly.time.length;
                    j++
                ) {


                    if (
                        data.hourly.time[j].substring(0, 13)
                        === currentHour
                    ) {

                        startIndex = j;

                        break;

                    }

                }


                /* NEXT 5 HOURS */

                var weatherText = "";


                for (
                    var i = startIndex;
                    i < startIndex + 5;
                    i++
                ) {


                    var time =
                        data.hourly.time[i].substring(11, 16);


                    var temperature =
                        Math.round(
                            data.hourly.temperature_2m[i]
                        );


                    var rain =
                        data.hourly.precipitation_probability[i];


                    var hourlyIcon =
                        getWeatherIcon(
                            data.hourly.weather_code[i]
                        );


                    weatherText +=

                        "<div class='forecast-row'>" +

                            "<span class='forecast-time'>" +
                                time +
                            "</span>" +

                            "<img class='forecast-icon' src='" +
                                hourlyIcon +
                            "'>" +

                            "<span class='forecast-temp'>" +
                                temperature +
                                "°C" +
                            "</span>" +

                            "<span>" +
                                rain +
                                "% rain" +
                            "</span>" +

                        "</div>";

                }


                document.getElementById("weatherText").innerHTML =
                    weatherText;


                /* NEXT FEW DAYS */

                var dailyText = "";


                var dayNames = [
                    "SUN",
                    "MON",
                    "TUE",
                    "WED",
                    "THU",
                    "FRI",
                    "SAT"
                ];


                for (
                    var d = 0;
                    d < 5;
                    d++
                ) {


                    var date =
                        new Date(
                            data.daily.time[d] +
                            "T12:00:00"
                        );


                    var day =
                        dayNames[date.getDay()];


                    var maxTemp =
                        Math.round(
                            data.daily.temperature_2m_max[d]
                        );


                    var minTemp =
                        Math.round(
                            data.daily.temperature_2m_min[d]
                        );


                    var rainChance =
                        data.daily.precipitation_probability_max[d];


                    var dailyIcon =
                        getWeatherIcon(
                            data.daily.weather_code[d]
                        );


                    dailyText +=

                        "<tr>" +

                            "<td class='daily-day'>" +
                                day +
                            "</td>" +

                            "<td class='daily-icon'>" +

                                "<img src='" +
                                    dailyIcon +
                                "'>" +

                            "</td>" +

                            "<td class='daily-temp'>" +

                                maxTemp +
                                "° / " +
                                minTemp +
                                "°" +

                            "</td>" +

                            "<td class='daily-rain'>" +

                                rainChance +
                                "% rain" +

                            "</td>" +

                        "</tr>";

                }


                document.getElementById("dailyText").innerHTML =
                    dailyText;


                /* SUNRISE / SUNSET */

                var sunrise =
                    data.daily.sunrise[0].substring(11, 16);


                var sunset =
                    data.daily.sunset[0].substring(11, 16);


                document.getElementById("sunriseText").innerHTML =
                    sunrise;


                document.getElementById("sunsetText").innerHTML =
                    sunset;


            }

        };


        xhr.send();

        /* NEWS */

var newsXhr = new XMLHttpRequest();

/* NEWS */

var newsXhr = new XMLHttpRequest();

newsXhr.open(
    "GET",
    "https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Ffeeds.bbci.co.uk%2Fnews%2Frss.xml",
    true
);

newsXhr.onreadystatechange = function() {

    if (
        newsXhr.readyState === 4 &&
        newsXhr.status === 200
    ) {

        var newsData = JSON.parse(newsXhr.responseText);

        var newsText = "";

        if (newsData.status === "ok") {

            for (
                var n = 0;
                n < 3 && n < newsData.items.length;
                n++
            ) {

                var title = newsData.items[n].title;
               var description =
    newsData.items[n].description ||
    newsData.items[n].content ||
    "";

                /* Remove HTML from the BBC summary */

                var temp = document.createElement("div");
                temp.innerHTML = description;

                var summary =
                    temp.textContent ||
                    temp.innerText ||
                    "";

                newsText +=
                    "<div class='news-story'>" +

                        "<div class='news-headline'>" +
                            "<span class='news-checkbox'></span>" +
title +
                        "</div>" +

                        "<div class='news-summary'>" +
                            summary +
                        "</div>" +

                    "</div>";
            }

        } else {

            newsText = "News feed unavailable.";

        }

        document.getElementById("newsText").innerHTML =
            newsText;
    }
};

newsXhr.send();

newsXhr.send();

    </script>


</body>

</html>
